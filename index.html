<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Staxx: Book Rankings</title>
<meta name="description" content="Rank every book you read. Find the next one you'll love." />
<style>
  :root {
    color-scheme: light dark;
    --bg: #F7F4EE; --surface: #FFFFFF; --text: #1C1917; --sub: #5E554D;
    --muted: #6F665D; --accent: #A8452A; --accent-text: #A8452A;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12100E; --surface: #1E1A17; --text: #F5EFE6; --sub: #C9C0B5;
      --muted: #A39B91; --accent: #C9573A; --accent-text: #F0A487; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 48px 16px;
    background: var(--bg); color: var(--text); text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .mark { width: 76px; height: 76px; border-radius: 18px; background: var(--accent);
    display: block; margin: 0 auto 28px; box-shadow: 0 8px 18px rgba(168,69,42,.32); }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 40px;
    line-height: 1.08; letter-spacing: -0.3px; margin: 0 0 14px; }
  p.sub { font-size: 18px; line-height: 1.45; color: var(--sub); max-width: 320px; margin: 0 auto 32px; }
  .soon { display: inline-block; background: var(--surface); border-radius: 999px; padding: 12px 22px;
    font-weight: 600; font-size: 15px; box-shadow: inset 0 0 0 1px rgba(128,110,95,.25); }
  footer { margin-top: 56px; font-size: 13px; color: var(--muted); }
  footer a { color: var(--accent-text); text-decoration: none; margin: 0 8px; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 1024 1024" role="img" aria-label="Staxx">
    <rect width="1024" height="1024" fill="currentColor" style="color:var(--accent)"/>
    <g transform="translate(512 512) scale(1.08) translate(-512 -588)">
      <rect x="236" y="330" width="164" height="470" rx="20" fill="#FAF7F2"/>
      <rect x="236" y="722" width="164" height="26" fill="#A8452A" opacity=".45"/>
      <rect x="430" y="430" width="164" height="370" rx="20" fill="#F2D4C4"/>
      <rect x="430" y="722" width="164" height="26" fill="#A8452A" opacity=".45"/>
      <rect x="624" y="520" width="164" height="280" rx="20" fill="#E9B9A2"/>
      <rect x="624" y="722" width="164" height="26" fill="#A8452A" opacity=".45"/>
      <path d="M284 330 h68 v190 l-34 -36 l-34 36 z" fill="#2A2521"/>
      <rect x="196" y="816" width="632" height="26" rx="13" fill="#FAF7F2"/>
    </g>
  </svg>
  <h1>Staxx</h1>
  <p class="sub">Rank every book you read. Find the next one you'll love.</p>
  <span class="soon">Coming soon to the App Store</span>
  <footer>
    <a href="/support/">Support</a>
    <a href="/privacy/">Privacy</a>
    <a href="/terms/">Terms</a>
  </footer>
</body>
</html>
